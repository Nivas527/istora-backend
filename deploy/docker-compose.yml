services:
  # =========================================================================
  # 1. PostgreSQL 16 Database
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: shopify_engine_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shopify_engine}
      POSTGRES_USER: ${POSTGRES_USER:-shopify_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set strong POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    command: >
      postgres -c max_connections=200
               -c shared_buffers=512MB
               -c effective_cache_size=1536MB
               -c work_mem=16MB
               -c maintenance_work_mem=128MB
    networks:
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shopify_admin} -d ${POSTGRES_DB:-shopify_engine}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =========================================================================
  # 2. ASP.NET Core 10 Web API
  # =========================================================================
  backend-api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: shopify_engine_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5200
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-shopify_engine};Username=${POSTGRES_USER:-shopify_admin};Password=${POSTGRES_PASSWORD};Maximum Pool Size=100;Connection Idle Lifetime=15;Timeout=15;
    volumes:
      - uploads_data:/app/uploads
    networks:
      - internal_net
    expose:
      - "5200"

  # =========================================================================
  # 3. Caddy Web Server & Reverse Proxy (Automatic SSL)
  # =========================================================================
  caddy:
    image: caddy:2.8-alpine
    container_name: shopify_engine_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 QUIC support
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - uploads_data:/var/www/uploads:ro
    depends_on:
      - backend-api
    networks:
      - internal_net

volumes:
  postgres_data:
    name: shopify_postgres_data
  uploads_data:
    name: shopify_uploads_data
  caddy_data:
    name: shopify_caddy_data
  caddy_config:
    name: shopify_caddy_config

networks:
  internal_net:
    name: shopify_internal_network
    driver: bridge
