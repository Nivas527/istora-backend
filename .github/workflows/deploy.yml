name: Deploy Production (Frontend & Backend)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # =========================================================================
  # 1. FRONTEND: Build & Deploy to Cloudflare Pages
  # =========================================================================
  deploy-frontend:
    name: Deploy Storefront to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Vite Production Bundle
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=istora-store --branch=apexcommerce
        continue-on-error: true # Ensures backend deployment proceeds if Cloudflare secrets are unset

  # =========================================================================
  # 2. BACKEND: Rebuild & Restart Container on AWS Lightsail
  # =========================================================================
  deploy-backend:
    name: Deploy .NET 10 API to AWS Lightsail
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to AWS Lightsail via Native OpenSSH
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USERNAME: ${{ secrets.LIGHTSAIL_USERNAME || 'deployer' }}
          LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          LIGHTSAIL_PORT: ${{ secrets.LIGHTSAIL_PORT || 22 }}
        run: |
          if [ -z "$LIGHTSAIL_HOST" ] || [ -z "$LIGHTSAIL_SSH_KEY" ]; then
            echo "❌ ERROR: LIGHTSAIL_HOST or LIGHTSAIL_SSH_KEY is empty. Check GitHub Repository Secrets."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Support both Base64-encoded key and raw PEM with automatic carriage return cleanup
          if echo "$LIGHTSAIL_SSH_KEY" | grep -q "BEGIN"; then
            echo "$LIGHTSAIL_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          else
            echo "$LIGHTSAIL_SSH_KEY" | tr -d '\r' | base64 -d > ~/.ssh/deploy_key
          fi
          echo "" >> ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Add host keys to known_hosts to prevent interactive prompts
          ssh-keyscan -p "$LIGHTSAIL_PORT" -H "$LIGHTSAIL_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # Execute remote deployment script natively via OpenSSH
          ssh -i ~/.ssh/deploy_key -p "$LIGHTSAIL_PORT" -o StrictHostKeyChecking=accept-new "$LIGHTSAIL_USERNAME@$LIGHTSAIL_HOST" bash << 'EOF'
            set -e
            echo "🚀 [CI/CD] Starting automated deployment on AWS Lightsail as dedicated deployer..."
            cd /opt/shopify-engine

            echo "📥 [1/4] Pulling latest code from GitHub main..."
            git pull origin main

            echo "📦 [2/4] Pre-Deployment Safety: Exporting pg_dump & syncing to Cloudflare R2..."
            cd deploy
            chmod +x backup-to-r2.sh restore-backup.sh 2>/dev/null || true
            ./backup-to-r2.sh || (echo "❌ Database backup failed! Aborting deploy to prevent data loss." && exit 1)

            echo "🔨 [3/4] Rebuilding backend-api container with additive migrations..."
            docker compose build --no-cache backend-api
            docker compose up -d backend-api

            echo "🩺 [4/4] Performing health check..."
            sleep 4
            curl -f -s http://localhost:5200/api/health || (echo "❌ Health check failed! Rollback snapshot available in /opt/shopify-engine/backups." && exit 1)

            echo "✅ [CI/CD] Deployment complete, database backed up, and service is healthy!"
          EOF

